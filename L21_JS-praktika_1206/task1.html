<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title></title>
</head>

<body>
    <input type="number" id="input">
    <button id="button">Проверить</button>
    <p id="output">Какой то текст</p>
    <script>
        let output = document.querySelector("#output");
        let button = document.querySelector("#button");

        button.onclick = function () {
            let num = document.querySelector("#input").value.trim();
            if (num % 2 === 0) {
                output.textContent = num + " - четное"
            } else {
                output.textContent = num + " - нечетное"
            }
        }
    </script>
</body>

</html>
