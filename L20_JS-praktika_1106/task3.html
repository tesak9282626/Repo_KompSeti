<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid black;
            background-color: gray;
        }

        div {
            margin: 10px;
        }
    </style>
</head>

<body>
    <div><button id="redBtn"></button></div>
    <div><button id="yellowBtn"></button></div>
    <div><button id="greenBtn"></button></div>
    <script>
        let red = document.querySelector("#redBtn");
        let yellow = document.querySelector("#yellowBtn");
        let green = document.querySelector("#greenBtn");

        red.onclick = function () {
            resetColors();
            red.style.backgroundColor = "red";
        }
        yellow.onclick = function () {
            resetColors();
            yellow.style.backgroundColor = "yellow";
        }
        green.onclick = function () {
            resetColors();
            green.style.backgroundColor = "green";
        }
        function resetColors() {
            red.style.backgroundColor = "gray";
            yellow.style.backgroundColor = "gray";
            green.style.backgroundColor = "gray";
        }
    </script>
</body>

</html>
