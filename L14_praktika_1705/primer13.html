<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CSS3</title>
    <style>
        q {
        font-style: italic;
        quotes: "\00AB" "\00BB";
        }
        q[title] {
        color: maroon;
        }
    </style>
</head>
<body>
<p>Продолжая известный закон Мёрфи, который гласит: <q>Если неприятность может случиться, то она обязательно
    случиться</q>, можем ввести свое наблюдение: <q title="Из законов Фергюсона-Мержевича">После того,
    как веб-страница будет корретно отображаться в одном браузере, выясниться, что неправильно показывается в другом
    месте</q>.</p>
</body>
</html>
