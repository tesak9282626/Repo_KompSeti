<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CSS3</title>
    <style>
        a[href$=".ru"] {
        background: url(ru.png) no-repeat 0 6px;
        padding-left: 12px;
        }
        a[href$=".com"] {
        background: url(com.png) no-repeat 0 6px;
        padding-left: 12px;
        }
    </style>
</head>
<body>
<p><a href="http://www.yandex.com">Yandex.com</a> |
    <a href="http://www.yandex.ru">Yandex.ru</a></p>
</body>
</html>
