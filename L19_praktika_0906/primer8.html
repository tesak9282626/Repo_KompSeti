<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Селекторы в CSS3</title>
    <style>
        p { text-align: center; }
        p:nth-of-type(1) { border: 40px outset blue; }
        p:nth-of-type(2) { border: 40px inset; border-color: red blue; }
        p:nth-of-type(3) { border: 40px groove; border-color: red green blue; }
        p:nth-of-type(4) { border: 40px ridge; border-color: red green blue violet; }
    </style>
</head>
<body>
<p>One-colored border! Стиль границ - outset</p>
<p>Two-colored border! Стиль границ - inset</p>
<p>Three-colored border! Стиль границ - groove</p>
<p>Four-colored border! Стиль границ - ridge</p>
</body>
</html>
