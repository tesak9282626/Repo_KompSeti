<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        p:nth-of-type(1) { padding-left: 0px; }
        p:nth-of-type(2) { padding-left: 2cm; margin: 0; border: 2px solid red; margin: 0; }
        p:nth-of-type(3) { padding-left: 50%; margin: 0; border: 2px solid red; margin: 0; }
    </style>
</head>
<body>
<p>Текст с left-padding</p>
<p>В данном блоке поле слева равно 2см</p>
<p>В данном блоке поле слева 50%</p>
</body>
</html>
