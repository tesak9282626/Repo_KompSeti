<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Селекторы в CSS3</title>
    <style>
        p:nth-of-type(1) { border: 2px solid black; border-radius: 50px 0 0 50px; padding: 20px; background-color: skyblue; }
        p:nth-of-type(2) { border: 2px solid black; border-radius: 40px 10px; padding: 20px; background-color: skyblue; }
        p:nth-of-type(3) { border: 2px solid black; border-radius: 13em/3em; padding: 20px; background-color: skyblue; }
        p:nth-of-type(4) { border: 2px solid black; border-radius: 13em 0.5em/1em 0.5em; padding: 20px; background-color: skyblue; }
        p:nth-of-type(5) { border: 2px solid black; border-radius: 8px; padding: 20px; background-color: skyblue; }
    </style>
</head>
<body>
<p>border-radius: 50px 0 0 50px</p>
<p>border-radius: 40px 10px</p>
<p>border-radius: 13em/3em</p>
<p>border-radius: 13em 0.5em/1em 0.5em</p>
<p>border-radius: 8px</p>
</body>
</html>
