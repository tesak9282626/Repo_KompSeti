<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        p {
        background-color: green;
        padding: 30px;
        margin: 0px;
        }
        p:nth-of-type(1) { opacity: 0.1; }
        p:nth-of-type(2) { opacity: 0.3; }
        p:nth-of-type(3) { opacity: 0.6; }
        p:nth-of-type(4) { opacity: 1; }
    </style>
</head>
<body>
<h1>Полупрозрачные блоки</h1>
<p>opacity: 0.1</p>
<p>opacity: 0.3</p>
<p>opacity: 0.6</p>
<p>opacity: 1 (default)</p>
</body>
</html>
