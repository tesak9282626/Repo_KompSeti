<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Селекторы в CSS3</title>
    <style>
        p { text-align: center; }
        p:nth-of-type(1) { border-style: dotted solid dashed double; border-width: 5px; border-color: black; padding-bottom: 20px; }
        p:nth-of-type(2) { border-style: dotted solid dashed; border-width: 5px; border-color: black; padding-bottom: 20px; }
        p:nth-of-type(3) { border-style: dotted solid; border-width: 5px; border-color: black; padding-bottom: 20px; }
        p:nth-of-type(4) { border-style: dotted; border-width: 5px; border-color: black; padding-bottom: 20px; }
    </style>
</head>
<body>
<p>This a some text in a paragraph</p>
<p>This a some text in a paragraph</p>
<p>This a some text in a paragraph</p>
<p>This a some text in a paragraph</p>
</body>
</html>
